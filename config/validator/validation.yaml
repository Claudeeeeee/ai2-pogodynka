# config/validator/validation.yaml

App\Entity\Location:
    properties:
        city:
            - NotBlank: ~
            - Length: { max: 50 }
            - Regex:
                pattern: '/^[^\d]*$/'
                message: 'City name cannot contain numbers.'
        country:
            - NotBlank: ~
            - Length: { max: 2 }
        voivodeship:
            - Length: { max: 50 }
        zipcode:
            - NotBlank: ~
            - Length: { max: 10 }
        latitude:
            - NotBlank: ~
            - Type:
                type: numeric
                message: 'Please enter a number.'
            - Range: { min: -90, max: 90 }
        longitude:
            - NotBlank: ~
            - Type:
                type: numeric
                message: 'Please enter a number.'
            - Range: { min: -180, max: 180 }

App\Entity\Measurement:
    properties:
        celsius:
            - NotBlank: ~
            - Type:
                type: numeric
                message: 'Please enter a number.'
            - Range: { min: -100, max: 100 }
        weatherRecord:
            - NotBlank: ~